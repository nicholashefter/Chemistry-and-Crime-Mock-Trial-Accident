<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nighttime Traffic Accident Reconstruction</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 8px;
      text-align: center;
    }

    p {
      color: #cbd5e1;
      text-align: center;
    }

    .controls {
      margin: 15px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      background: #1d4ed8;
    }

    #scene {
      position: relative;
      width: 900px;
      max-width: 95vw;
      height: 560px;
      overflow: hidden;
      border: 3px solid #475569;
      border-radius: 10px;
      background: #020617;
    }

    /* Night sky */
    .moon {
      position: absolute;
      top: 30px;
      right: 65px;
      width: 65px;
      height: 65px;
      background: #f8fafc;
      border-radius: 50%;
      box-shadow: 0 0 25px #f8fafc;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
    }

    /* Roads */
    .horizontal-road {
      position: absolute;
      top: 205px;
      left: 0;
      width: 100%;
      height: 155px;
      background: #374151;
    }

    .vertical-road {
      position: absolute;
      top: 0;
      left: 375px;
      width: 155px;
      height: 100%;
      background: #374151;
    }

    .road-line-horizontal {
      position: absolute;
      top: 280px;
      left: 0;
      width: 100%;
      border-top: 4px dashed #facc15;
    }

    .road-line-vertical {
      position: absolute;
      top: 0;
      left: 452px;
      height: 100%;
      border-left: 4px dashed #facc15;
    }

    /* Crosswalk */
    .crosswalk {
      position: absolute;
      top: 220px;
      left: 540px;
      width: 125px;
      height: 125px;
      transform: rotate(90deg);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .crosswalk div {
      height: 12px;
      background: white;
      opacity: 0.85;
    }

    /* Stop sign */
    .stop-sign {
      position: absolute;
      top: 130px;
      left: 305px;
      width: 65px;
      height: 65px;
      background: #dc2626;
      border: 5px solid white;
      color: white;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      clip-path: polygon(
        30% 0%, 70% 0%, 100% 30%, 100% 70%,
        70% 100%, 30% 100%, 0% 70%, 0% 30%
      );
      z-index: 5;
    }

    .stop-pole {
      position: absolute;
      top: 195px;
      left: 334px;
      height: 65px;
      border-left: 6px solid #9ca3af;
      z-index: 4;
    }

    /* Vehicles */
    .vehicle {
      position: absolute;
      width: 82px;
      height: 43px;
      border-radius: 8px;
      border: 3px solid #111827;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
    }

    .vehicle::before,
    .vehicle::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      background: #020617;
      border-radius: 50%;
      bottom: -8px;
      border: 2px solid #9ca3af;
    }

    .vehicle::before {
      left: 8px;
    }

    .vehicle::after {
      right: 8px;
    }

    #suv {
      background: #2563eb;
      top: 235px;
      left: 170px;
    }

    #oncomingCar {
      background: #f97316;
      top: 145px;
      left: 415px;
      transform: rotate(90deg);
    }

    /* Pedestrian */
    #pedestrian {
      position: absolute;
      top: 255px;
      left: 625px;
      width: 25px;
      height: 45px;
      z-index: 8;
      transition: transform 0.2s;
    }

    .head {
      width: 17px;
      height: 17px;
      background: #fbbf24;
      border-radius: 50%;
      margin: auto;
    }

    .body {
      width: 12px;
      height: 22px;
      background: #22c55e;
      margin: auto;
      border-radius: 4px;
    }

    .legs {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .leg {
      width: 5px;
      height: 16px;
      background: #1e40af;
    }

    /* Labels */
    .label {
      position: absolute;
      z-index: 20;
      background: rgba(15, 23, 42, 0.85);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      color: #f8fafc;
    }

    #intersectionLabel {
      top: 370px;
      left: 390px;
    }

    #stopLabel {
      top: 105px;
      left: 270px;
    }

    #crosswalkLabel {
      top: 350px;
      left: 565px;
    }

    #impactLabel {
      display: none;
      top: 170px;
      left: 550px;
      color: #facc15;
      font-size: 16px;
      font-weight: bold;
    }

    /* Crash effect */
    #crashEffect {
      display: none;
      position: absolute;
      top: 180px;
      left: 510px;
      width: 80px;
      height: 80px;
      z-index: 30;
      color: #facc15;
      font-size: 60px;
      font-weight: bold;
      text-shadow: 0 0 20px #f97316;
      animation: flash 0.3s infinite alternate;
    }

    @keyframes flash {
      from {
        transform: scale(1);
        opacity: 0.6;
      }

      to {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
      color: #facc15;
      text-align: center;
    }

    @media (max-width: 700px) {
      #scene {
        height: 450px;
      }

      .horizontal-road {
        top: 165px;
      }

      .vertical-road {
        left: 45%;
      }

      .road-line-horizontal {
        top: 242px;
      }

      .road-line-vertical {
        left: 53%;
      }
    }
  </style>
</head>

<body>
  <h1>Nighttime Traffic Accident Reconstruction</h1>
  <p>
    Demonstration: SUV runs a stop sign and is struck by an oncoming vehicle.
  </p>

  <div class="controls">
    <button onclick="playAccident()">▶ Play Accident</button>
    <button onclick="resetScene()">↻ Reset</button>
  </div>

  <div id="scene">
    <div class="moon"></div>

    <!-- Stars -->
    <div class="star" style="top:40px;left:100px;"></div>
    <div class="star" style="top:80px;left:220px;"></div>
    <div class="star" style="top:55px;left:430px;"></div>
    <div class="star" style="top:120px;left:700px;"></div>
    <div class="star" style="top:90px;left:820px;"></div>
    <div class="star" style="top:170px;left:100px;"></div>

    <!-- Roads -->
    <div class="horizontal-road"></div>
    <div class="vertical-road"></div>
    <div class="road-line-horizontal"></div>
    <div class="road-line-vertical"></div>

    <!-- Crosswalk -->
    <div class="crosswalk">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>

    <!-- Stop sign -->
    <div class="stop-sign">STOP</div>
    <div class="stop-pole"></div>

    <!-- Labels -->
    <div class="label" id="stopLabel">Stop Sign</div>
    <div class="label" id="intersectionLabel">Intersection</div>
    <div class="label" id="crosswalkLabel">Crosswalk</div>
    <div class="label" id="impactLabel">POINT OF IMPACT</div>

    <!-- Vehicles -->
    <div class="vehicle" id="suv">SUV</div>
    <div class="vehicle" id="oncomingCar">CAR</div>

    <!-- Pedestrian -->
    <div id="pedestrian">
      <div class="head"></div>
      <div class="body"></div>
      <div class="legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>

    <!-- Crash effect -->
    <div id="crashEffect">✹</div>
  </div>

  <div id="status">Ready to begin reconstruction.</div>

  <script>
    const suv = document.getElementById("suv");
    const oncomingCar = document.getElementById("oncomingCar");
    const pedestrian = document.getElementById("pedestrian");
    const crashEffect = document.getElementById("crashEffect");
    const impactLabel = document.getElementById("impactLabel");
    const statusText = document.getElementById("status");

    let animationRunning = false;

    function sleep(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    async function playAccident() {
      if (animationRunning) return;

      animationRunning = true;
      resetScene();

      animationRunning = true;

      setStatus("The SUV approaches the intersection...");
      await sleep(800);

      setStatus("The SUV blows through the stop sign!");
      suv.style.transition = "left 2s linear";
      suv.style.left = "350px";
      await sleep(2000);

      setStatus("An oncoming vehicle enters the intersection...");
      oncomingCar.style.transition = "top 1.5s linear";
      oncomingCar.style.top = "205px";
      await sleep(1500);

      setStatus("T-BONE COLLISION!");
      crashEffect.style.display = "block";
      impactLabel.style.display = "block";

      suv.style.transition = "left 1s ease-out, top 1s ease-out";
      suv.style.left = "535px";
      suv.style.top = "250px";

      oncomingCar.style.transition = "left 1s ease-out";
      oncomingCar.style.left = "480px";

      await sleep(1000);

      setStatus("The impact sends the SUV toward the crosswalk...");
      crashEffect.style.display = "none";

      suv.style.transition = "left 1.2s ease-out, top 1.2s ease-out, transform 1.2s";
      suv.style.left = "615px";
      suv.style.top = "300px";
      suv.style.transform = "rotate(25deg)";

      await sleep(900);

      setStatus("The pedestrian is struck by the moving SUV.");
      pedestrian.style.transition = "left 0.8s ease-out, top 0.8s ease-out, transform 0.8s";
      pedestrian.style.left = "700px";
      pedestrian.style.top = "330px";
      pedestrian.style.transform = "rotate(90deg)";

      await sleep(1000);

      setStatus("The other vehicle leaves the scene.");
      oncomingCar.style.transition = "left 2s linear";
      oncomingCar.style.left = "850px";

      await sleep(2000);

      setStatus("Reconstruction complete.");
      animationRunning = false;
    }

    function resetScene() {
      suv.style.transition = "none";
      oncomingCar.style.transition = "none";
      pedestrian.style.transition = "none";

      suv.style.left = "170px";
      suv.style.top = "235px";
      suv.style.transform = "rotate(0deg)";

      oncomingCar.style.left = "415px";
      oncomingCar.style.top = "145px";
      oncomingCar.style.transform = "rotate(90deg)";

      pedestrian.style.left = "625px";
      pedestrian.style.top = "255px";
      pedestrian.style.transform = "rotate(0deg)";

      crashEffect.style.display = "none";
      impactLabel.style.display = "none";

      setStatus("Ready to begin reconstruction.");

      if (!animationRunning) {
        animationRunning = false;
      }
    }
  </script>
</body>
</html>
